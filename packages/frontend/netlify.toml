[[redirects]]
  from = "/api/*"
  to = "http://18.141.180.119/api/:splat"
  status = 200
  force = true # COMMENT: ensure that we always redirect

[[redirects]]
  from = "/ws/*"
  to = "ws://18.141.180.119/ws/:splat"
  status = 200
  force = true # COMMENT: ensure that we always redirect


[[redirects]]
  from = "/.well-known/*"
  to = "http://18.141.180.119/.well-known/:splat"
  status = 200
  force = true # COMMENT: ensure that we always redirect


[[redirects]]
  from = "/*"
  to = "index.html"
  status = 200

[build]
  command = "pnpm -F frontend run build"
  publish = "dist"
