[[redirects]]
  from = "/api/*"
  to = "http://3.0.58.48/api/:splat"
  status = 200
  force = true # COMMENT: ensure that we always redirect

[[redirects]]
  from = "/ws/*"
  to = "http://3.0.58.48/ws/:splat"
  status = 200
  force = true # COMMENT: ensure that we always redirect


[[redirects]]
  from = "/*"
  to = "index.html"
  status = 200

[build]
  command = "pnpm -F frontend run build"
  publish = "dist"