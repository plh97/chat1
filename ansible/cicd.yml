---
- hosts: "{{ target_hosts | default('vultr') }}"
  gather_facts: true
  become: "{{ (ansible_user | default('root')) != 'root' }}"
  become_method: sudo
  vars:
    repo_url: https://github.com/plh97/chat1.git
    deploy_branch: main
    app_root: /opt/chat2
    backend_root: /opt/chat2/packages/backend-go
    backend_binary: /opt/chat2/packages/backend-go/bin/server
    backend_service_name: chat2-backend
    nginx_site_name: chat2
  tasks:
    - name: Deploy application
      block:
        - name: Ensure app directory exists
          file:
            path: "{{ app_root }}"
            state: directory
            mode: "0755"

        - name: Pull latest application code
          git:
            repo: "{{ repo_url }}"
            dest: "{{ app_root }}"
            force: true
            version: "{{ deploy_branch }}"
            accept_hostkey: true

        - name: Install workspace dependencies
          command:
            cmd: pnpm install --frozen-lockfile
            chdir: "{{ app_root }}"

        - name: Prepare backend dependencies/build/logs
          command:
            cmd: make deploy-prepare
            chdir: "{{ backend_root }}"

        - name: Install backend systemd service
          copy:
            dest: "/etc/systemd/system/{{ backend_service_name }}.service"
            mode: "0644"
            content: |
              [Unit]
              Description=Chat2 backend service
              After=network.target docker.service
              Wants=docker.service

              [Service]
              Type=simple
              WorkingDirectory={{ backend_root }}
              ExecStart={{ backend_binary }} -conf {{ backend_root }}/config/prod.yml
              Restart=always
              RestartSec=5
              Environment=GIN_MODE=release

              [Install]
              WantedBy=multi-user.target

        - name: Reload systemd
          systemd:
            daemon_reload: true

        - name: Restart backend service
          systemd:
            name: "{{ backend_service_name }}"
            enabled: true
            state: restarted
      tags:
        - app
