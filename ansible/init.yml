---
- hosts: "{{ target_hosts | default('vultr') }}"
  gather_facts: true
  become: "{{ (ansible_user | default('root')) != 'root' }}"
  become_method: sudo
  vars:
    go_version: 1.24.5
  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      apt:
        name:
          - ca-certificates
          - certbot
          - curl
          - git
          - gnupg
          - make
          - nginx
          - python3-docker
          - python3-certbot-nginx
          - python3-pip
          - rsync
          - ufw
        state: present

    - name: Install Docker
      shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: Download Go toolchain
      get_url:
        url: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
        dest: "/tmp/go{{ go_version }}.linux-amd64.tar.gz"
        mode: "0644"

    - name: Remove old Go installation
      file:
        path: /usr/local/go
        state: absent

    - name: Install Go toolchain
      unarchive:
        src: "/tmp/go{{ go_version }}.linux-amd64.tar.gz"
        dest: /usr/local
        remote_src: true

    - name: Symlink Go binary
      file:
        src: /usr/local/go/bin/go
        dest: /usr/local/bin/go
        state: link

    - name: Symlink Gofmt binary
      file:
        src: /usr/local/go/bin/gofmt
        dest: /usr/local/bin/gofmt
        state: link

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: true

    - name: Start nginx service
      service:
        name: nginx
        state: started
        enabled: true

    - name: Allow OpenSSH through firewall
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: Allow HTTP through firewall
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS through firewall
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Allow port 8000 through firewall
      community.general.ufw:
        rule: allow
        port: "8000"
        proto: tcp

    - name: Allow port 8080 through firewall
      community.general.ufw:
        rule: allow
        port: "8080"
        proto: tcp

    - name: Allow port 8081 through firewall
      community.general.ufw:
        rule: allow
        port: "8081"
        proto: tcp

    - name: Enable firewall
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Check running containers
      docker_host_info:
        containers: true
      register: docker_info

    - name: Stop running containers
      docker_container:
        name: "{{ item.Names[0] | regex_replace('^/', '') }}"
        state: stopped
      loop: "{{ docker_info.containers }}"
      when: docker_info.containers | length > 0

    - name: Install Node.js 20
      shell: curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      args:
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Install Node.js
      apt:
        name: nodejs
        state: present
        update_cache: true

    - name: Enable corepack
      command: corepack enable
      changed_when: false

    - name: Activate pnpm
      command: corepack prepare pnpm@10.0.0-alpha.2 --activate
      changed_when: false
...
