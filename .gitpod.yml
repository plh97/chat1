image:
  file: .gitpod.Dockerfile

tasks:

  - init: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"


    command: exec zsh

  - name: run frontend
    openMode: split-left
    init: pnpm install
    command: pnpm run dev

  - name: run backend
    openMode: split-right
    init: pnpm install
    command: pnpm run db

ports:
  - port: 9001
    name: frontend
    visibility: private
    # onOpen: open-preview
