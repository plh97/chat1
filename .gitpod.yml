# This configuration file was automatically generated by Gitpod.
# Please adjust to your needs (see https://www.gitpod.io/docs/introduction/learn-gitpod/gitpod-yaml)
# and commit this file to your remote git repository to share the goodness with others.

# Learn more from ready-to-use templates: https://www.gitpod.io/docs/introduction/getting-started/quickstart

image:
  file: .gitpod.Dockerfile

tasks:
  - init: |
      aptcurl -L https://github.com/robbyrussell/oh-my-zsh/raw/master/tools/install.sh | sh
      wget https://gist.github.com/ricardocabral/0d431a9b78363b9457363df72f047eef/raw/219b0dabb56662a56ff749ae1c3e7020c0051001/mitsuhiko.zsh-theme -P  ~/.oh-my-zsh/themes
      sed -ri 's/robbyrussell/mitsuhiko/' ~/.zshrc
      
    command: exec zsh

  - name: run frontend
    openMode: split-left
    init: pnpm install
    command: pnpm run dev

  - name: run backend
    openMode: split-right
    init: pnpm install
    command: pnpm run db

ports:
  - port: 9001
    name: frontend
    visibility: private
    # onOpen: open-preview
