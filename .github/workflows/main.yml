name: Lighthouse CI
run-name: Lighthouse Budget Audit on ${{ github.ref_name }} by ${{ github.actor }}
on: push
jobs:
  lighthouse:
    name: Hosted Lighthouse Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Audit URLs using Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://c.plhh.org/
            https://c.plhh.org/login
          budgetPath: ./.github/lighthouse/budget.json # test performance budgets
          uploadArtifacts: false # avoid failing artifact upload on current GH artifact API behavior
          temporaryPublicStorage: true # upload lighthouse report to the temporary
